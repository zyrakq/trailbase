configVersion: 1
project: argiago-web

deploy:
  namespace: argiago
  namespaceSlug: false
  helmChartDir: .helm/dev
---
image: argiago_web
dockerfile: Dockerfile
context: .
args: {
  VITE_APP_KEYCLOAK_CLIENT_ID: web,
  VITE_APP_KEYCLOAK_URL: https://keycloak.argiago.test/realms/argiago-test,
  VITE_ENVIRONMENT_NAME: development
}
