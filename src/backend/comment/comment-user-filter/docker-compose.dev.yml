version: '3.8'

services:
  comment-user-filter:
    container_name: comment-user-filter
    image: "{{ .Values.werf.image.comment_user_filter }}"
    labels:
      kompose.service.expose: "comment-user-filter.argiago.test"
      kompose.service.expose.tls-secret: "comment-user-filter-secret"
      cert-manager.io/cluster-issuer: cert-manager-issuer
      kompose.service.expose.ingress-class-name: "nginx"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthcheck" ]
      interval: 20s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      ISSUER: https://keycloak.argiago.test/realms/argiago-test
      DB_URL: postgresql://postgres:postgres@${KEYCLOAKDB_SERVICE_HOST}:${KEYCLOAKDB_SERVICE_PORT}/postgres
      REALM: argiago-test
    ports:
      - "80:8080"
    networks:
      - argiago-network
  
networks:
  argiago-network:
    name: argiago-network
    external: true
      