version: '3.8'

services:
  post-commander:
    container_name: post-commander
    image: "{{ .Values.werf.image.post_commander }}"
    labels:
      kompose.service.expose: "post-commander.argiago.test"
      kompose.service.expose.tls-secret: "post-commander-secret"
      cert-manager.io/cluster-issuer: cert-manager-issuer
      kompose.service.expose.ingress-class-name: "nginx"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthcheck" ]
      interval: 20s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      SITE: https://${POST_REQUESTER_SERVICE_HOST}:${POST_REQUESTER_SERVICE_PORT}
      ISSUER: https://keycloak.argiago.test/realms/argiago-test

      AMQP_ADDR: amqp://guest:guest@${RABBITMQ_SERVICE_HOST}:5672
      DB_URL: mongodb://root:root@${MONGO_SERVICE_HOST}:${MONGO_SERVICE_PORT}
      DB_NAME: post_event_store
      COLLECTION_NAME: post
    ports:
      - "80:8080"
    networks:
      - argiago-network
  
networks:
  argiago-network:
    name: argiago-network
    external: true
      