version: '3.8'

services:
  author-switcher:
    container_name: author-switcher
    image: "{{ .Values.werf.image.author_switcher }}"
    labels:
      kompose.service.expose: "author-switcher.argiago.test"
      kompose.service.expose.tls-secret: "author-switcher-secret"
      cert-manager.io/cluster-issuer: cert-manager-issuer
      kompose.service.expose.ingress-class-name: "nginx"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthcheck" ]
      interval: 20s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      ISSUER: https://keycloak.argiago.test/realms/argiago-test
      TOKEN_URL: https://keycloak.argiago.test/realms/argiago-test/protocol/openid-connect/token
      CLIENT_ID: author-switcher
      CLIENT_SECRET: UeBfjDJoOhKXiH4yOEHC24qoh2YLIh1f
      AUDIENCE: author-switcher
      REQWEST_CONTENT_TYPE: form
      HOST_URL: https://keycloak.argiago.test
      REALM: argiago-test
    ports:
      - "80:8080"
    networks:
      - argiago-network
  
networks:
  argiago-network:
    name: argiago-network
    external: true
      