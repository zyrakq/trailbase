  labels:
    io.kompose.service: author-switcher
  name: author-switcher
spec:
  ingressClassName: nginx
  rules:
    - host: author-switcher.argiago.test
      http:
        paths:
          - backend:
              service:
                name: author-switcher
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - author-switcher.argiago.test
      secretName: author-switcher-secret
status:
