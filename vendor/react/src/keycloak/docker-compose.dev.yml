version: '3.8'

services:
  keycloakdb:
    container_name: keycloakdb
    image: postgres:12.9
    labels:
      kompose.controller.type: "statefulset"
      kompose.service.expose: "keycloakdb.argiago.test"
      kompose.service.expose.ingress-class-name: "nginx"
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh", "-c", "exec pg_isready -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - keycloakdb:/var/lib/postgresql/data
    networks:
      - argiago-network

  keycloak:
    container_name: keycloak
    image: "{{ .Values.werf.image.argiago_keycloak }}"
    labels:
      kompose.service.expose: "keycloak.argiago.test"
      kompose.service.expose.tls-secret: "keycloak-secret"
      cert-manager.io/cluster-issuer: cert-manager-issuer
      kompose.service.expose.ingress-class-name: "nginx"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
      interval: 20s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloakdb:5432/postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_FEATURES:
        token-exchange
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'false'
      KC_HTTP_ENABLED: 'true'
      PROXY_ADDRESS_FORWARDING: 'true'
      KC_CACHE_STACK: tcp
      KC_HEALTH_ENABLED: 'true'
    configs:
      - source: argiago-realm
        target: /opt/keycloak/data/import/argiago.json
      - source: argiago-test-realm
        target: /opt/keycloak/data/import/argiago-test.json
    command:
      - "start"
      - "--http-port 8080"
      - "--proxy=passthrough"
      - "--import-realm"
    ports:
      - 80:8080
    depends_on:
      - keycloakdb
    networks:
      - argiago-network

configs:
  argiago-realm:
    file: ./import/argiago.json
  argiago-test-realm:
    file: ./import/argiago-test.json
  
volumes:
  keycloakdb:
    driver: local

networks:
  argiago-network:
    name: argiago-network