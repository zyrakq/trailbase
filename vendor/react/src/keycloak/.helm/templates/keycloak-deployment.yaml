apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cert-manager-issuer
    kompose.cmd: kompose convert -f docker-compose.dev.yml -o ./.helm/templates
    kompose.service.expose: keycloak.argiago.test
    kompose.service.expose.ingress-class-name: nginx
    kompose.service.expose.tls-secret: keycloak-secret
    kompose.version: 1.28.0 (HEAD)
  creationTimestamp: null
  labels:
    io.kompose.service: keycloak
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: keycloak
  strategy: {}
  template:
    metadata:
      annotations:
        cert-manager.io/cluster-issuer: cert-manager-issuer
        kompose.cmd: kompose convert -f docker-compose.dev.yml -o ./.helm/templates
        kompose.service.expose: keycloak.argiago.test
        kompose.service.expose.ingress-class-name: nginx
        kompose.service.expose.tls-secret: keycloak-secret
        kompose.version: 1.28.0 (HEAD)
      creationTimestamp: null
      labels:
        io.kompose.network/argiago-network: "true"
        io.kompose.service: keycloak
    spec:
      containers:
        - args:
            - start
            - --http-port 8080
            - --proxy=passthrough
            - --import-realm
          env:
            - name: KC_CACHE_STACK
              value: tcp
            - name: KC_DB
              value: postgres
            - name: KC_DB_PASSWORD
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloakdb:5432/postgres
            - name: KC_DB_USERNAME
              value: postgres
            - name: KC_FEATURES
              value: token-exchange
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_BACKCHANNEL
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
            - name: PROXY_ADDRESS_FORWARDING
              value: "true"
          image: {{ .Values.werf.image.argiago_keycloak }}
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:8080/health/ready
            failureThreshold: 5
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
          name: keycloak
          ports:
            - containerPort: 8080
          resources: {}
          volumeMounts:
            - mountPath: /opt/keycloak/data/import/argiago.json
              name: argiago-realm
              subPath: argiago.json
            - mountPath: /opt/keycloak/data/import/argiago-test.json
              name: argiago-test-realm
              subPath: argiago-test.json
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: argiago.json
                path: argiago.json
            name: argiago-realm
          name: argiago-realm
        - configMap:
            items:
              - key: argiago-test.json
                path: argiago-test.json
            name: argiago-test-realm
          name: argiago-test-realm
status: {}
