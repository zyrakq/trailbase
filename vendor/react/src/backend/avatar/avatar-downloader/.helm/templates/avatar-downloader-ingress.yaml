apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cert-manager-issuer
    kompose.cmd: kompose convert -f docker-compose.dev.yml -o ./.helm/templates
    kompose.service.expose: avatar-downloader.argiago.test
    kompose.service.expose.ingress-class-name: nginx
    kompose.service.expose.tls-secret: avatar-downloader-secret
    kompose.version: 1.28.0 (HEAD)
    kompose.volume.type: hostPath
  creationTimestamp: null
  labels:
    io.kompose.service: avatar-downloader
  name: avatar-downloader
spec:
  ingressClassName: nginx
  rules:
    - host: avatar-downloader.argiago.test
      http:
        paths:
          - backend:
              service:
                name: avatar-downloader
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - avatar-downloader.argiago.test
      secretName: avatar-downloader-secret
status:
  loadBalancer: {}
