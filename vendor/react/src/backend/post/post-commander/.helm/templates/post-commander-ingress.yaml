apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cert-manager-issuer
    kompose.cmd: kompose convert -f docker-compose.dev.yml -o ./.helm/templates
    kompose.service.expose: post-commander.argiago.test
    kompose.service.expose.ingress-class-name: nginx
    kompose.service.expose.tls-secret: post-commander-secret
    kompose.version: 1.28.0 (HEAD)
  creationTimestamp: null
  labels:
    io.kompose.service: post-commander
  name: post-commander
spec:
  ingressClassName: nginx
  rules:
    - host: post-commander.argiago.test
      http:
        paths:
          - backend:
              service:
                name: post-commander
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - post-commander.argiago.test
      secretName: post-commander-secret
status:
  loadBalancer: {}
