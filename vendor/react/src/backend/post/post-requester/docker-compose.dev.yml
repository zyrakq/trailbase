version: '3.8'

services:
  post-requester:
    container_name: post-requester
    image: "{{ .Values.werf.image.post_requester }}"
    labels:
      kompose.service.expose: "post-requester.argiago.test"
      kompose.service.expose.tls-secret: "post-requester-secret"
      cert-manager.io/cluster-issuer: cert-manager-issuer
      kompose.service.expose.ingress-class-name: "nginx"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthcheck" ]
      interval: 20s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      ISSUER: https://keycloak.argiago.test/realms/argiago-test

      DB_URL: mongodb://root:root@${MONGO_SERVICE_HOST}:${MONGO_SERVICE_PORT}
      DB_NAME: post_store
      COLLECTION_NAME: post
    ports:
      - "80:8080"
    networks:
      - argiago-network
  
networks:
  argiago-network:
    name: argiago-network
    external: true
      