[package]
name = "comment-filter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = { version = "4.3.1" }
actix-cors = "0.6.4"

mongodb-macro = "1.0.3"
mongodb = { version = "2.4.0" }
bson = { version = "2.4.0", features = ["uuid-1"] }
uuid = {version = "1.2.2", features = ["v4"] }

dotenv = "0.15.0"
env_logger = "0.10.0"

clap = { version = "4.2.1", features = ["derive", "env"] }
envmnt = "0.10.4"

thiserror = "1.0"
anyhow = "1.0.66"

reqwest = { version = "0.11.16", features = [ "json" ] }
form_urlencoded = "1.1.0"


serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

futures = "0.3"
itertools = "0.10.5"

#auth
once_cell = "1.4"
aliri = "0.6.1"
aliri_oauth2 = { version = "0.9.0", features= ["default-tls"] }
aliri_actix = "0.8.0"
aliri_clock = { version = "0.1.4", features = ["serde"] }

aliri_extra_reqwest = { version = "0.1.0", features= ["default-tls"], git = "https://github.com/erritis/aliri_extra", branch = "master" }

[patch.crates-io]
aliri = { version = "0.6.1", git = "https://github.com/erritis/aliri", branch = "develop" }
aliri_actix = { version = "0.8.0", git = "https://github.com/erritis/aliri", branch = "develop" }
aliri_oauth2 = { version = "0.9.0", git = "https://github.com/erritis/aliri", branch = "develop" }

aliri_reqwest = { version = "0.4.1", git = "https://github.com/erritis/aliri", branch = "develop" }
aliri_tokens = { version = "0.2.0", git = "https://github.com/erritis/aliri", branch = "develop" }
aliri_clock = { version = "0.1.4", features = ["serde"], git = "https://github.com/erritis/aliri", branch = "develop" }