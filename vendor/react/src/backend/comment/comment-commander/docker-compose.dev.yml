version: '3.8'

services:
  comment-commander:
    container_name: comment-commander
    image: "{{ .Values.werf.image.comment_commander }}"
    labels:
      kompose.service.expose: "comment-commander.argiago.test"
      kompose.service.expose.tls-secret: "comment-commander-secret"
      cert-manager.io/cluster-issuer: cert-manager-issuer
      kompose.service.expose.ingress-class-name: "nginx"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthcheck" ]
      interval: 20s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      SITE: https://${COMMENT_REQUESTER_SERVICE_HOST}:${COMMENT_REQUESTER_SERVICE_PORT}
      ISSUER: https://keycloak.argiago.test/realms/argiago-test

      AMQP_ADDR: amqp://guest:guest@${RABBITMQ_SERVICE_HOST}:5672
      DB_URL: mongodb://root:root@${MONGO_SERVICE_HOST}:${MONGO_SERVICE_PORT}
      DB_NAME: comment_event_store
      COLLECTION_NAME: comment
    ports:
      - "80:8080"
    networks:
      - argiago-network
  
networks:
  argiago-network:
    name: argiago-network
    external: true
      