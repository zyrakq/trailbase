version: '3.8'

services:
  comment-worker:
    container_name: comment-worker
    image: "{{ .Values.werf.image.comment_worker }}"
    environment:
      AMQP_ADDR: amqp://guest:guest@${RABBITMQ_SERVICE_HOST}:5672
      DB_URL: mongodb://root:root@${MONGO_SERVICE_HOST}:${MONGO_SERVICE_PORT}
      DB_NAME: comment_event_store
      COLLECTION_NAME: comment
      VIEW_DB_URL: mongodb://root:root@${MONGO_SERVICE_HOST}:${MONGO_SERVICE_PORT}
      VIEW_DB_NAME: comment_store
      VIEW_COLLECTION_NAME: comment
    networks:
      - argiago-network
  
networks:
  argiago-network:
    name: argiago-network
    external: true
      