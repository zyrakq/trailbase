apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kompose.cmd: kompose convert -f docker-compose.prod.yml -o ./.helm/prod/templates -n argiago
    kompose.image-pull-secret: registry-auth-client-secret
    kompose.service.expose: argiago.ru
    kompose.service.expose.ingress-class-name: nginx
    kompose.service.expose.tls-secret: argiago-web-prod-secret
    kompose.version: 1.31.0 (HEAD)
  creationTimestamp: null
  labels:
    io.kompose.service: web
  name: web
  namespace: argiago
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web
  strategy: {}
  template:
    metadata:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        kompose.cmd: kompose convert -f docker-compose.prod.yml -o ./.helm/prod/templates -n argiago
        kompose.image-pull-secret: registry-auth-client-secret
        kompose.service.expose: argiago.ru
        kompose.service.expose.ingress-class-name: nginx
        kompose.service.expose.tls-secret: argiago-web-prod-secret
        kompose.version: 1.31.0 (HEAD)
      creationTimestamp: null
      labels:
        io.kompose.network/argiago-network: "true"
        io.kompose.service: web
    spec:
      containers:
        - image: "{{ .Values.werf.image.argiago_web }}"
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:3000
            failureThreshold: 5
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
          name: web
          ports:
            - containerPort: 3000
          resources: {}
      imagePullSecrets:
        - name: registry-auth-client-secret
      restartPolicy: Always
status: {}
