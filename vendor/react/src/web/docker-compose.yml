version: "3.8"

services:
  web:
    container_name: web
    image: argiago-web
    build:
      context: .
      args:
        VITE_APP_KEYCLOAK_CLIENT_ID: web
        VITE_APP_KEYCLOAK_URL: https://keycloak.argiago.ru/realms/argiago-test
        VITE_ENVIRONMENT_NAME: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 20s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      VITE_APP_KEYCLOAK_CLIENT_ID: web
      VITE_APP_KEYCLOAK_URL: https://keycloak.argiago.ru/realms/argiago-test
      VITE_ENVIRONMENT_NAME: production
    ports:
      - "3000:3000"
    networks:
      - argiago-network

networks:
  argiago-network:
    name: argiago-network
