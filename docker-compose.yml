x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}

services:
  velora-web:
    container_name: velora-web
    image: velora
    build: .
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 4000:4000
    volumes:
      - velora-traildepot:/workspace/app/traildepot

volumes:
  velora-traildepot:
    name: argiago-traildepot
