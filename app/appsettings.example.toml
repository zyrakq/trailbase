# appsettings.example.toml
#
# Full reference for all available settings with descriptions and defaults.
# Copy relevant sections to appsettings.local.toml (gitignored) or supply
# values via environment variables: APP_SECTION__SUBSECTION__KEY=value
#
# Load order (each layer overrides the previous):
#   1. appsettings.toml              — required base defaults
#   2. appsettings.{APP_ENV}.toml    — env-specific overrides (default: development)
#   3. appsettings.local.toml        — personal local overrides (gitignored)
#   4. APP_* environment variables

# ------------------------------------------------------------------------------
# HTTP server
# ------------------------------------------------------------------------------

[server]
# Address and port the HTTP server listens on.
address = "0.0.0.0:4000"

# ------------------------------------------------------------------------------
# Branding
#
# Identity and theming for the user-facing app. brand_name and theme_color_light are
# surfaced in the UI; branding_dir is an optional path to additional branding
# assets (logo, favicon, etc.).
#
# Environment overrides (APP_<SECTION>__<KEY>):
#   APP_BRANDING__BRAND_NAME
#   APP_BRANDING__THEME_COLOR_LIGHT
#   APP_BRANDING__THEME_COLOR_DARK
#   APP_BRANDING__BRANDING_DIR
# ------------------------------------------------------------------------------

[branding]
# Brand name shown in the UI.
brand_name = "VELORA"

# Primary theme color for light mode (hex).
theme_color_light = "#ff6b35"

# Primary theme color for dark mode (hex). Defaults to #10b981 when unset.
# theme_color_dark = "#10b981"

# Optional directory with branding assets (logo, favicon, etc.).
# Empty string → no extra assets.
branding_dir = ""

# ------------------------------------------------------------------------------
# Frontend
# ------------------------------------------------------------------------------

[frontend]
# Where to serve frontend assets from.
#   "disk"     — serve from ui/dist/ on disk (dev hot reload via bun watch)
#   "embedded" — serve from assets compiled into the binary at build time (prod)
# Default: "disk". Empty string is treated as "disk" for backwards compat.
# bun install + bun run build are run automatically by build.rs at compile time.
serve_from = "disk"

# Spawn `bun watch` in the background. Useful in development.
watch = false

# Directory to serve frontend assets from (disk mode only).
# Empty string → <CARGO_MANIFEST_DIR>/ui/dist
public_dir = ""

# Show the password login form in the auth UI.
# Absent or null → determined by trailbase.auth.disable_password_auth at runtime.
# password_auth_enabled = true

# ------------------------------------------------------------------------------
# Email interceptor (development only)
# Mailcrab catches all outgoing SMTP and exposes a UI to inspect emails.
# Never enable in production.
# ------------------------------------------------------------------------------

[mailcrab]
# Start the mailcrab SMTP interceptor and serve its UI under `path`.
dev_intercept = false

# URL prefix for the mailcrab web UI and API.
path = "/_/mailcrab"

# IP the mailcrab SMTP listener binds to.
smtp_host = "127.0.0.1"

# Port the mailcrab SMTP listener binds to.
smtp_port = 1025

# ------------------------------------------------------------------------------
# WASM components
#
# Single source of truth for the WASM components the app installs at
# startup. Both runtime (settings::loader -> main) and build.rs read
# the same `[components]` block — change entries here, not in each
# consumer.
#
# Each `[[components.items]]` entry pairs a `wasm` file name (the file
# that must end up in traildepot/wasm/) with a `source` describing how
# to obtain it. Two source variants are supported:
#
#   source = { build = "<cargo-package>" }
#     Compile a local cargo package for wasm32-wasip2. Value is the
#     package name (`cargo build -p <value>`).
#
#   source = { fetch = "<name-or-url>" }
#     Download via `trail components add <value>`. Accepts a short
#     registry name (e.g. "trailbase/auth_ui") or a direct URL to a
#     release artifact. When the URL points to a .zip archive, add the
#     optional `zip_name` key to specify the filename to extract from
#     inside the zip (defaults to `wasm` when omitted):
#
#     source = { fetch = "https://example.com/bundle.zip", zip_name = "auth_ui.wasm" }
#
# Switching workflow:
#   To switch the live component, comment out one `[[components.items]]`
#   block and uncomment another — the change takes effect on the next
#   startup (and the next build.rs run for build-sourced items).
#
# Overlay caveat:
#   The `config` crate replaces arrays wholesale when overlaying files.
#   That means env-specific files (appsettings.{APP_ENV}.toml and
#   appsettings.local.toml) cannot *append* a new item to the list —
#   they must redeclare the full `[[components.items]]` array. Put
#   shared entries in appsettings.toml; per-env overrides belong in
#   the env-specific file.
# ------------------------------------------------------------------------------

[components]
# Global default for build-sourced items: always copy the fresh artifact
# from target/ over the existing one in traildepot/wasm/ on each install.
rebuild = false

# Global default for fetch-sourced items: always re-run `trail components
# add` even when the wasm file is already present in traildepot/wasm/.
refetch = false

# Live example — fetch the pre-built auth_ui component from the registry.
# This block is active by default. Comment it out (and uncomment the
# wcauth block below) to switch to the locally-built variant.
[[components.items]]
name = "auth_ui"
# File name the component must install into traildepot/wasm/. Plain
# filename only — no path separators, no `..`, no absolute paths.
wasm = "auth_ui_component.wasm"
source = { fetch = "https://github.com/trailbaseio/trailbase/releases/download/v0.28.6/trailbase_v0.28.6_wasm_auth_ui.zip" }

# Alternative — compile a local cargo package. Uncomment this block and
# comment out the auth_ui block above to switch to the build variant.
# The package is built with `cargo build -p <value> --target wasm32-wasip2`.
# [[components.items]]
# name = "wcauth"
# wasm = "wcauth.wasm"
# source = { build = "wcauth-tb-component" }

# Per-item overrides (optional): any entry may set `rebuild` (build-kind
# only) or `refetch` (fetch-kind only) to override the global default
# above. Absent or null → use the global default.
#
# [[components.items]]
# name = "wcauth"
# wasm = "wcauth.wasm"
# source = { build = "wcauth-tb-component" }
# rebuild = true
#
# [[components.items]]
# name = "auth_ui"
# wasm = "auth_ui_component.wasm"
# source = { fetch = "https://github.com/trailbaseio/trailbase/releases/download/v0.28.6/trailbase_v0.28.6_wasm_auth_ui.zip" }
# refetch = true

# ------------------------------------------------------------------------------
# TrailBase bootstrap
#
# Applied ONCE — on the very first startup when
# app/traildepot/config.textproto does not yet exist.
# After first start TrailBase owns config.textproto; these values are ignored.
# To re-apply: delete app/traildepot/config.textproto and restart.
# ------------------------------------------------------------------------------

[trailbase.server]
# Name shown in the TrailBase admin UI and email subjects.
application_name = "Velora"

# Canonical public URL; used in OAuth redirects and email links.
site_url = "http://localhost:4000"

# How long TrailBase keeps request logs (seconds). Default: 604800 (7 days).
logs_retention_sec = 604800

# ------------------------------------------------------------------------------

[trailbase.auth]
# Disable password-based sign-up and login (OIDC only when true).
disable_password_auth = false

# Allow sign-in via one-time password sent by email.
enable_otp_signin = false

# ------------------------------------------------------------------------------
# OIDC provider (oidc0 / Kanidm)
# Omit this section entirely, or set client_id = "", to disable OIDC.
# Supply the secret via env var — never commit it:
#   APP_TRAILBASE__AUTH__OIDC0__CLIENT_SECRET=<value>
# ------------------------------------------------------------------------------

[trailbase.auth.oidc0]
client_id = "velora"
client_secret = ""
auth_url = "https://idm.velora.ru/ui/oauth2"
token_url = "https://idm.velora.ru/oauth2/token"
user_api_url = "https://idm.velora.ru/oauth2/openid/velora/userinfo"

# ------------------------------------------------------------------------------
# Outgoing SMTP for TrailBase (password resets, OTP emails, etc.)
#
# Priority:
#   1. smtp_host set here  → these settings used as-is
#   2. smtp_host empty + email.dev_intercept = true  → mailcrab transport
#      auto-filled; sender_name / sender_address still applied if set
#   3. Neither  → email block left at TrailBase defaults
#
# Supply smtp_password via env var:
#   APP_TRAILBASE__SMTP__SMTP_PASSWORD=<value>
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Email templates (optional)
#
# Override the built-in TrailBase templates for transactional emails.
# Each sub-section is entirely optional — omit it (or leave subject/body empty)
# to keep the TrailBase default for that message type.
#
# Template variables available in body/subject:
#   {{ APP_NAME }}        — application name (from trailbase.server.application_name)
#   {{ EMAIL }}           — recipient email address
#   {{ SITE_URL }}        — canonical site URL (from trailbase.server.site_url)
#
# Additional variables per type:
#   user_verification / change_email:
#     {{ VERIFICATION_URL }}, {{ TOKEN }}, {{ CODE }}, {{ REDIRECT_URI }}
#   password_reset:
#     {{ TOKEN }}, {{ CODE }}
#   otp:
#     {{ CODE }}, {{ REDIRECT_URI }}
# ------------------------------------------------------------------------------

# [trailbase.email.user_verification]
# subject = ""
# body = ""

# [trailbase.email.password_reset]
# subject = ""
# body = ""

# [trailbase.email.change_email]
# subject = ""
# body = ""

# [trailbase.email.otp]
# subject = ""
# body = ""

# ------------------------------------------------------------------------------

[trailbase.smtp]
# SMTP server hostname or IP. Empty → section inactive (transport not configured).
smtp_host = ""

# SMTP port. Default: 587.
smtp_port = 587

# Authentication username (optional).
smtp_username = ""

# Authentication password (optional). Prefer env var over storing here.
smtp_password = ""

# Encryption mode: "none" | "starttls" | "tls". Default: "starttls".
smtp_encryption = "starttls"

# Display name in the From: header (optional).
sender_name = ""

# Email address in the From: header (optional).
sender_address = ""
