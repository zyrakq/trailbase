[workspace]
members = ["app", "vendor/trailbase/crates/auth-ui", "components/wcauth"]
default-members = ["app"]
exclude = ["vendor/trailbase", "vendor/mailcrab"]
resolver = "2"

[workspace.dependencies]
axum = { version = "^0.8.1", features = ["json"] }
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
env_logger = { version = "^0.11.8", default-features = false, features = ["auto-color", "humantime"] }
tokio = { version = "^1.38.0", default-features = false, features = ["fs", "io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.1", default-features = false }
pretty_env_logger = "0.5"
dotenvy = "0.15"
config = { version = "0.15", features = ["toml"] }

# Dependencies required by vendor/trailbase/crates/auth-ui (built as workspace member).
askama = { version = "0.16.0", default-features = false, features = ["derive", "std", "config"] }
rust-embed = { version = "8.4.0", default-features = false, features = ["mime-guess"] }
trailbase-wasm = { path = "./vendor/trailbase/crates/wasm-runtime-guest" }
trailbase-build = { path = "./vendor/trailbase/crates/build" }

trailbase = { git = "https://github.com/zyrakq/trailbase", default-features = false, features = ["wasm", "pg"] }
mailcrab = { path = "vendor/mailcrab/mailcrab" }
mailcrab-server = { path = "vendor/mailcrab/backend" }

# Use local vendor/trailbase subtree instead of fetching from git.
# [patch] is ignored by downstream consumers of trailbase, so this only
# affects top-level builds of this workspace.
[patch."https://github.com/zyrakq/trailbase"]
trailbase = { path = "./vendor/trailbase/crates/core"}

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
